modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# The logo over the mod's details in the mod list (every version reads logoFile; 26.3 shows it as the banner), and the
# small square 26.3 shows beside the mod's name in the list (iconFile); both drawn smoothly.
logoFile="particlemuter_logo.png"
logoBlur=true
iconFile="particlemuter_icon.png"
iconBlur=true
description='''
${mod_description}
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
