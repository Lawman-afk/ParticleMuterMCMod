plugins {
    id 'java-library'
    // Forge for 1.20.1 through ModDevGradle's plugin for the older Forge versions (official names in the sources, the jar
    // turned back to Forge's SRG names for players: reobfJar), as Ground Burst's 1.20.1 branch.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    exclude("**/.cache", "**/.cache/**")
}

repositories {
    // Extreme Sound Muffler (-PwithESM): a compatibility run only, never a dependency of the mod.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    // The Minecraft version in the name, so this jar is never taken for another version's.
    archivesName = "${mod_id}-mc${minecraft_version}"
}

// The licence travels in the jar (MIT asks for its notice in every copy).
tasks.named('jar', Jar) {
    def licenceName = "LICENSE_${project.property('mod_id')}"
    from('LICENSE') {
        rename { licenceName }
    }
    // The dev aid (the prepared test world and its photographer) is for the dev runs only, never in a released jar.
    exclude('dev/particlemuter/devworld/**')
    // Forge 1.20.1 finds a mod's mixins through the jar's manifest.
    manifest.attributes([
            'MixinConfigs': "${mod_id}.legacy.mixins.json,${mod_id}.mixins.json"
    ])
}

// Minecraft 1.20.1 runs on Java 17, so this branch targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// The photographers' window, width x height: -PshotSize=1920x1080 for the mod page's gallery pictures.
def shotSize = (project.findProperty('shotSize') ?: '1280x720').toString().split('x')

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }

        // Makes the test world "Particle Lab" (run/saves/particle_lab) with particle sources set out and signs saying what to
        // try, photographs the results into run/screenshots/lab_*.png and quits, the world saved to copy into the test
        // instance's saves (devworld, left out of the jar).
        lab {
            client()
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'particlemuter.lab', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // The mixins' refmap names official names; the dev runs are on official names too.
            systemProperty 'mixin.env.remapRefMap', 'true'
            if (project.findProperty('jfr') != null) {
                def jfrDir = file('run/jfr')
                jfrDir.mkdirs()
                jvmArguments.add("-XX:StartFlightRecording=filename=${new File(jfrDir, project.findProperty('jfr').toString() + '.jfr').absolutePath},settings=profile,dumponexit=true".toString())
            }
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The test runs leave the person at the computer their mouse and their ears (the user's wishes): their window shows
// behind the other windows without the focus and never grabs the mouse (dev.particlemuter.client.DevRuns and the dev mixins,
// set by particlemuter.keepMouse; the runs turn the camera themselves), Forge's early loading window turned off for them in
// run/config/fml.toml; every client run is muted (master volume 0 in run/options.txt; -Psound=on keeps the sound) and
// skips the first-launch accessibility screen. The test runs' names go in testRunNames as they are added.
def testRunNames = ['runLab']
def fmlConfig = file('run/config/fml.toml')
def clientOptions = file('run/options.txt')
def withSound = providers.gradleProperty('sound').isPresent()
legacyForge.runs.matching { ('run' + it.name.capitalize()) in testRunNames }.configureEach {
    systemProperty 'particlemuter.keepMouse', 'true'
}
tasks.matching { it.name in testRunNames }.configureEach {
    doFirst {
        fmlConfig.parentFile.mkdirs()
        String text = fmlConfig.exists() ? fmlConfig.text : ''
        fmlConfig.text = text =~ /(?m)^earlyWindowControl\s*=/
                ? text.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
                : text + 'earlyWindowControl = false\n'
    }
}
tasks.matching { it.name.startsWith('run') && !(it.name in ['runGameTestServer', 'runServer', 'runData']) }.configureEach {
    doFirst {
        String text = clientOptions.exists() ? clientOptions.text : ''
        clientOptions.parentFile.mkdirs()
        if (!withSound) {
            text = text =~ /(?m)^soundCategory_master:/
                    ? text.replaceAll(/(?m)^soundCategory_master:.*$/, 'soundCategory_master:0.0')
                    : text + (text.isEmpty() || text.endsWith('\n') ? '' : '\n') + 'soundCategory_master:0.0\n'
        }
        text = text =~ /(?m)^onboardAccessibility:/
                ? text.replaceAll(/(?m)^onboardAccessibility:.*$/, 'onboardAccessibility:false')
                : text + 'onboardAccessibility:false\n'
        clientOptions.text = text
    }
}


// The mixins' refmap (official names to Forge's SRG names for players' games), made as the code compiles.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.legacy.mixins.json"
    config "${mod_id}.mixins.json"
}

// Runtime-only dependencies for dev testing that must not leak into the published metadata.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras: its annotations for the refmap, and the library packed in the jar (Forge 1.20.1 carries none).
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}"))
    // Main's nullness annotations (26.x ships them; 1.20.1 does not): only to compile, as annotations go unread.
    compileOnly 'org.jspecify:jspecify:1.0.0'

    // Extreme Sound Muffler (optional at runtime): -PwithESM runs it in the dev client, to check the button beside its.
    if (providers.gradleProperty('withESM').isPresent()) {
        modRuntimeOnly "maven.modrinth:extreme_sound_muffler:${esm_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Every compile error at once while porting (javac stops at 100).
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


abstract class DeployToInstance extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getJarFile()

    @Internal
    abstract DirectoryProperty getModsDir()

    @Input
    abstract Property<String> getModId()

    /** Whether an instance folder was named outright (particlemuter_instance_dir_1_20_1): then a missing one is an error. */
    @Input
    abstract Property<Boolean> getRequired()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void deploy() {
        File dir = modsDir.isPresent() ? modsDir.get().asFile : null
        if (dir == null || !dir.parentFile.isDirectory()) {
            String where = dir == null ? "(no folder set on this system)" : "${dir.parentFile}"
            if (required.get()) {
                throw new GradleException("CurseForge instance not found at ${where}. " +
                        "Set particlemuter_instance_dir_1_20_1 in gradle.properties or pass -Pparticlemuter_instance_dir_1_20_1=<path>.")
            }
            logger.lifecycle("No CurseForge instance at ${where}: the jar was not deployed (set particlemuter_instance_dir_1_20_1 to deploy it).")
            return
        }
        dir.mkdirs()

        String prefix = modId.get() + '-'
        dir.listFiles()
                .findAll { it.isFile() && it.name.startsWith(prefix) && it.name.endsWith('.jar') }
                .each { old ->
                    if (!old.delete()) {
                        throw new GradleException("Could not delete ${old} - is Minecraft still running from that instance?")
                    }
                    logger.lifecycle("Removed old jar ${old.name}")
                }

        File jar = jarFile.get().asFile
        fs.copy {
            from jar
            into dir
        }
        logger.lifecycle("Deployed ${jar.name} -> ${dir}")
    }
}

var instanceDir = providers.gradleProperty('particlemuter_instance_dir_1_20_1')
        .filter { !it.isBlank() }

var deployToInstance = tasks.register('deployToInstance', DeployToInstance) {
    group = 'deployment'
    description = 'Copies the built mod jar (reobfJar: Forge names) into the 1.20.1 CurseForge test instance, replacing older builds.'
    jarFile = tasks.named('reobfJar').flatMap { it.archiveFile }
    modsDir = layout.dir(instanceDir.map { new File(it, 'mods') })
    modId = project.mod_id
    required = providers.gradleProperty('particlemuter_instance_dir_1_20_1').map { !it.isBlank() }.orElse(false)
    outputs.upToDateWhen { false }
}

tasks.named('build') {
    finalizedBy deployToInstance
}
