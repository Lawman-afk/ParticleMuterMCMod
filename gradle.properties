# Gradle daemon memory.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# Must match the CurseForge test instance: "ParticleMuter1.20.1".
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.28
forge_version_range=[47,)
# MixinExtras, packed in the jar (Forge 1.20.1 carries none).
mixinextras_version=0.5.5

## Compatibility runs (optional; never a dependency of the mod)
# Modrinth version id: Extreme Sound Muffler 3.51 (Forge 1.20.1) for -PwithESM.
esm_version=drxm9tKI

# The shader packs and mods of the compatibility runs (Culprit's ids, Modrinth version ids).
complementary_version=Bqen1mJX
bsl_version=Y68yiql9
bliss_version=kC2Y8q1P
photon_version=BnGklH5y
solas_version=IsqhVpb8
makeup_version=t4YRxQug
unbound_version=B1kyfoUZ
oculus_version=iQ1SwGc3
embeddium_version=UTbfe5d1
# Rubidium Extra 0.5.4.4 for -PwithSodiumExtra; Distant Horizons for -PwithDH (Modrinth version ids).
sodium_extra_version=F06DXCMX
dh_version=6UnEfsRQ

## Mod properties
mod_id=particlemuter
mod_name=Particle Muter
mod_license=MIT
mod_version=1.0.1
mod_group_id=dev.particlemuter
mod_authors=Lawman-afk
mod_description=Turn off any particle, from Minecraft or any mod, from a button in your inventory. Each one is listed with its picture and how many are spawning around you right now; click one to stop it being drawn.

## Deployment
# Folder of the CurseForge instance that every `build` copies the reobfuscated jar into (its mods folder). Set it in
# your own ~/.gradle/gradle.properties; left blank, the jar just stays in build/libs.
particlemuter_instance_dir_1_20_1=
