# Gradle daemon memory. NeoForm decompile/recompile runs in its own process, so 2G is plenty here.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# Must match the CurseForge test instance (minecraftinstance.json -> baseModLoader): "ParticleMuter1.21.1".
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.267

## Compatibility runs (optional; none of these is a dependency of the mod)
# Modrinth version id: Extreme Sound Muffler 3.57 (NeoForge 1.21.1) for -PwithESM.
esm_version=nUCCmquN

# The shader packs and mods of the compatibility runs (Culprit's ids, Modrinth version ids).
complementary_version=Bqen1mJX
bsl_version=Y68yiql9
bliss_version=kC2Y8q1P
photon_version=BnGklH5y
solas_version=IsqhVpb8
makeup_version=t4YRxQug
unbound_version=B1kyfoUZ
iris_version=KduFYu4t
sodium_version=uMOpc5uV
iris_stable_version=t3ruzodq
sodium_stable_version=Pb3OXVqC
# Sodium Extra 0.9.5 for -PwithSodiumExtra; Distant Horizons for -PwithDH (Modrinth version ids).
sodium_extra_version=T819dLGI
dh_version=9w34y8ai

## Mod properties
mod_id=particlemuter
mod_name=Particle Muter
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.particlemuter
mod_authors=Lawman-afk
mod_description=Turn off any particle, from Minecraft or any mod, from a button in your inventory. Each one is listed with its picture and how many are spawning around you right now; click one to stop it being drawn.

## Deployment
# Folder of the CurseForge instance that every `build` copies the jar into (its mods folder). Set it in your own
# ~/.gradle/gradle.properties (or pass -Pparticlemuter_instance_dir_1_21_1=...); left blank, the jar just stays in build/libs.
particlemuter_instance_dir_1_21_1=
